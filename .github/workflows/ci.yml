name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values, not real secrets — riot_client/db are mocked in tests,
      # but config.py reads these at import time so something must be set.
      RIOT_API_KEY: dummy-ci-key
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,lint]"
      - run: ruff check .
      - run: pytest
