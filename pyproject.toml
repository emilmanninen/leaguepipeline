[project]
name = "leaguepipeline"
version = "0.1.0"
description = "Riot API ingestion pipeline for League of Legends match data"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "psycopg2-binary==2.9.12",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
lint = ["ruff==0.16.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# A deliberate starter set, not ruff's much broader current default:
# pyflakes, pycodestyle errors, import sorting, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]
