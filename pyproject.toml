[project]
name = "leaguepipeline"
version = "0.1.0"
description = "Riot API ingestion pipeline for League of Legends match data"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "psycopg2-binary==2.9.12",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
